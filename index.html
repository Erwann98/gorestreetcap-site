<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f7f7">
  <title>Page unavailable</title>
  <style>
    :root{
      --bg:#f7f7f7;
      --ink:#202124;
      --muted:#6f7479;
      --line:#d9dde1;
      --grid:#3c4043;
      --good:#1a73e8;
      --bad:#d93025;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--ink);
      font-family:Arial,Helvetica,sans-serif;
      overflow:hidden;
    }
    .page{
      width:min(100%,760px);
      margin:0 auto;
      padding:9vh 26px 0;
      user-select:none;
    }
    .icon{
      width:46px;height:46px;
      border:3px solid var(--grid);
      border-radius:8px;
      position:relative;
      margin-bottom:24px;
    }
    .icon:after{
      content:"";
      position:absolute;
      right:-8px;top:15px;
      width:6px;height:14px;
      background:var(--grid);
      border-radius:0 3px 3px 0;
    }
    .icon .fill{
      position:absolute;
      left:5px;right:5px;bottom:5px;
      height:42%;
      background:var(--grid);
      border-radius:3px;
    }
    h1{
      margin:0 0 12px;
      font-size:30px;
      line-height:1.2;
      font-weight:500;
      letter-spacing:-.02em;
    }
    p{
      margin:0;
      color:var(--muted);
      font-size:15px;
      line-height:1.6;
    }
    .hint{
      margin-top:18px;
      font-size:13px;
      color:#8a8f94;
    }
    kbd{
      font-family:inherit;
      border:1px solid #c7cbd0;
      border-bottom-width:2px;
      border-radius:4px;
      padding:2px 6px;
      background:#fff;
      color:#4a4d50;
      font-size:12px;
    }

    .game-wrap{
      margin-top:34px;
      opacity:.18;
      transition:opacity .25s ease;
    }
    .game-wrap.active{opacity:1}

    .status-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      color:#777c81;
      font-size:12px;
      margin-bottom:8px;
    }
    .score{
      font-variant-numeric:tabular-nums;
      color:#4b4f53;
    }

    canvas{
      width:100%;
      height:220px;
      display:block;
      border-top:1px solid #dadce0;
      border-bottom:1px solid #dadce0;
      background:transparent;
    }

    .footer{
      display:flex;
      justify-content:space-between;
      gap:16px;
      margin-top:10px;
      color:#8a8f94;
      font-size:11px;
    }

    .flash{
      animation:flash .2s linear;
    }
    @keyframes flash{
      50%{background:#eceff1}
    }

    @media(max-width:600px){
      .page{padding-top:7vh}
      h1{font-size:26px}
      canvas{height:190px}
    }
  </style>
</head>
<body>
  <main class="page" id="page">
    <div class="icon" aria-hidden="true"><div class="fill"></div></div>
    <h1>This page isn’t available.</h1>
    <p>The connection to the power service was interrupted.</p>
    <div class="hint">Press <kbd>space</kbd> to retry.</div>

    <section class="game-wrap" id="gameWrap" aria-label="connection retry">
      <div class="status-row">
        <span id="statusText">waiting for connection…</span>
        <span class="score" id="score">0000</span>
      </div>
      <canvas id="game" width="760" height="220"></canvas>
      <div class="footer">
        <span>keep the grid balanced</span>
        <span id="best">best 0000</span>
      </div>
    </section>
  </main>

<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const wrap = document.getElementById("gameWrap");
  const statusText = document.getElementById("statusText");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const page = document.getElementById("page");

  const W = canvas.width, H = canvas.height;
  const MID = H * 0.56;

  let running = false;
  let alive = true;
  let score = 0;
  let best = Number(localStorage.getItem("gridDecoyBest") || 0);
  let last = 0;
  let t = 0;
  let battery = 0.52;       // 0..1 state of charge
  let grid = 0;             // imbalance -1..1
  let playerPower = 0;      // -1 charge, +1 discharge
  let targetPower = 0;
  let pulse = 0;
  let history = Array(90).fill(0);
  let nextDisturbance = 1.2;

  bestEl.textContent = "best " + String(best).padStart(4,"0");

  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  function reset(){
    score = 0;
    t = 0;
    battery = 0.52;
    grid = 0;
    playerPower = 0;
    targetPower = 0;
    pulse = 0;
    history = Array(90).fill(0);
    nextDisturbance = 1.1;
    alive = true;
    statusText.textContent = "connection unstable";
    wrap.classList.add("active");
    draw();
  }

  function start(){
    if(running && alive) return;
    if(!alive) reset();
    running = true;
    alive = true;
    last = performance.now();
    statusText.textContent = "connection unstable";
    wrap.classList.add("active");
    requestAnimationFrame(loop);
  }

  function fail(){
    running = false;
    alive = false;
    statusText.textContent = "connection lost — press space";
    if(score > best){
      best = score;
      localStorage.setItem("gridDecoyBest", String(best));
      bestEl.textContent = "best " + String(best).padStart(4,"0");
    }
    page.classList.add("flash");
    setTimeout(()=>page.classList.remove("flash"),220);
  }

  function disturbance(){
    const strength = 0.55 + Math.random()*0.5;
    grid += (Math.random() < .5 ? -1 : 1) * strength;
    nextDisturbance = t + 1.2 + Math.random()*1.8;
  }

  function loop(now){
    if(!running || !alive) return;
    const dt = Math.min((now-last)/1000, .04);
    last = now;
    t += dt;

    if(t >= nextDisturbance) disturbance();

    // Player input applies a smooth dispatch pulse.
    playerPower += (targetPower - playerPower) * Math.min(1, dt*8);

    // Battery limits change what you can actually do.
    let effectivePower = playerPower;
    if(battery < .04 && effectivePower > 0) effectivePower *= battery/.04;
    if(battery > .96 && effectivePower < 0) effectivePower *= (1-battery)/.04;

    // Positive power supports a short grid; charging absorbs a long grid.
    grid += (-effectivePower * 1.7 - grid * .45) * dt;
    grid += Math.sin(t*2.4)*0.012;

    // State of charge.
    battery -= effectivePower * .18 * dt;
    battery = clamp(battery,0,1);

    // Score rewards staying near balance, with slightly more reward for active correction.
    const error = Math.abs(grid);
    if(error < .18){
      score += 2;
      if(Math.abs(effectivePower) > .1) score += 1;
      statusText.textContent = "grid balanced";
    } else if(error < .45){
      score += 1;
      statusText.textContent = grid > 0 ? "excess power" : "power shortfall";
    } else {
      statusText.textContent = grid > 0 ? "frequency rising" : "frequency falling";
    }

    pulse += dt;
    if(pulse > .08){
      pulse = 0;
      history.push(grid);
      history.shift();
      scoreEl.textContent = String(score).padStart(4,"0");
    }

    // Fail if imbalance stays extreme or battery hits a hard edge while correcting.
    if(Math.abs(grid) > 1.05){
      fail();
      draw();
      return;
    }

    draw();
    requestAnimationFrame(loop);
  }

  function draw(){
    ctx.clearRect(0,0,W,H);

    // subtle grid
    ctx.strokeStyle = "rgba(60,64,67,.08)";
    ctx.lineWidth = 1;
    for(let x=0;x<W;x+=76){
      ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();
    }
    for(let y=0;y<H;y+=44){
      ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();
    }

    // safe band
    ctx.fillStyle = "rgba(26,115,232,.055)";
    ctx.fillRect(0,MID-22,W,44);

    ctx.strokeStyle = "rgba(60,64,67,.18)";
    ctx.beginPath();
    ctx.moveTo(0,MID);
    ctx.lineTo(W,MID);
    ctx.stroke();

    // waveform
    ctx.strokeStyle = "#3c4043";
    ctx.lineWidth = 2;
    ctx.beginPath();
    history.forEach((v,i)=>{
      const x = i/(history.length-1)*W;
      const y = MID - v*72;
      if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
    ctx.stroke();

    // current cursor
    const cy = MID - grid*72;
    ctx.fillStyle = Math.abs(grid)<.2 ? "#1a73e8" : Math.abs(grid)<.55 ? "#5f6368" : "#d93025";
    ctx.beginPath();
    ctx.arc(W-8,cy,5,0,Math.PI*2);
    ctx.fill();

    // battery
    const bx=22, by=18, bw=82, bh=22;
    ctx.strokeStyle="#5f6368";
    ctx.lineWidth=2;
    ctx.strokeRect(bx,by,bw,bh);
    ctx.fillStyle="#5f6368";
    ctx.fillRect(bx+bw,by+6,6,10);

    ctx.fillStyle = battery>.18 ? "#5f6368" : "#d93025";
    ctx.fillRect(bx+4,by+4,(bw-8)*battery,bh-8);

    // dispatch arrow
    ctx.fillStyle="#6f7479";
    ctx.font="12px Arial";
    ctx.fillText(
      playerPower > .08 ? "discharging" : playerPower < -.08 ? "charging" : "idle",
      122, 34
    );
  }

  function setPower(v){
    targetPower = v;
    if(!running) start();
  }

  window.addEventListener("keydown", e => {
    if(e.code === "Space"){
      e.preventDefault();
      if(!running) start();
      targetPower = 1; // space = discharge/support grid
    }
    if(e.code === "ArrowDown" || e.code === "KeyS"){
      e.preventDefault();
      setPower(-1);    // charge/absorb
    }
  });

  window.addEventListener("keyup", e => {
    if(e.code === "Space" || e.code === "ArrowDown" || e.code === "KeyS"){
      e.preventDefault();
      targetPower = 0;
    }
  });

  canvas.addEventListener("pointerdown", e => {
    e.preventDefault();
    if(!running) start();
    const rect = canvas.getBoundingClientRect();
    const y = (e.clientY-rect.top)/rect.height;
    targetPower = y < .5 ? 1 : -1;
  });
  window.addEventListener("pointerup", ()=>targetPower=0);

  draw();
})();
</script>
</body>
</html>
