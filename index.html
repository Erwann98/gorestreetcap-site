<html lang="en">
<head>

  <title>Website coming soon</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;

      background: #f4f2ed;
      color: #171717;
      font-family: Georgia, "Times New Roman", serif;
    }

    .coming-soon {

    }

      margin: 0;
      font-size: clamp(3rem, 9vw, 7rem);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.05em;
    }

    p {
      margin: 18px 0 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1rem;
      color: #666;
    }
